<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自分専用秘書アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header id="app-header" class="app-header"></header>
      <main id="app-main" class="app-main">
        <section id="view-home" class="view"></section>
        <section id="view-schedule" class="view" hidden></section>
        <section id="view-task" class="view" hidden></section>
        <section id="view-candidates" class="view" hidden></section>
        <section id="view-log" class="view" hidden></section>
        <section id="view-settings" class="view" hidden></section>
      </main>
      <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>

    <dialog id="modal-root" class="modal-root"></dialog>

    <script src="app.js" defer></script>
  </body>
</html>
